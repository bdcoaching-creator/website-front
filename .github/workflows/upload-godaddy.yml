# Bouwt de site na elke wijziging op main (ook vanuit Pages CMS) en zet hem via SSH (SFTP-poort 22)
# in public_html bij GoDaddy. FTP/FTPS (poort 21) werkt niet vanaf GitHub naar deze hosting.
# Nodig: repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         servernaam, bijv. adaptxs.com of de servernaam uit cPanel
#   SSH_USER         cPanel-gebruikersnaam
#   SSH_PRIVATE_KEY  private sleutel (uit cPanel → SSH Access → Manage SSH Keys)
#   SSH_PASSPHRASE   wachtwoord van die sleutel (leeg laten als de sleutel geen wachtwoord heeft)
#   SSH_PORT         optioneel, standaard 22
# Zolang de verplichte secrets ontbreken, wordt de site wel gebouwd en gecontroleerd, maar niet geüpload.

name: Upload naar GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee uploads tegelijk; een nieuwere wijziging wacht op de vorige.
concurrency:
  group: upload-godaddy
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Code ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node installeren
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Inhoud controleren en site bouwen
        run: npm run build

      - name: Formulierscript testen
        run: node --test tests/unit/*.test.ts

      - name: Controleren of de SSH-gegevens zijn ingesteld
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "klaar=ja" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=nee" >> "$GITHUB_OUTPUT"
            echo "::notice::Geen upload: SSH_HOST, SSH_USER en SSH_PRIVATE_KEY zijn nog niet allemaal ingesteld."
          fi

      - name: SSH-sleutel klaarzetten
        if: steps.ssh.outputs.klaar == 'ja'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          # Windows-regeleinden weghalen (bij kopiëren uit cPanel kan dat gebeuren).
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/upload_key
          chmod 600 ~/.ssh/upload_key
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -q -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/upload_key \
              || { echo "::error::De sleutel kon niet worden geopend. Klopt SSH_PASSPHRASE?"; exit 1; }
          fi
          ssh-keygen -y -f ~/.ssh/upload_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY is geen geldige private sleutel (of heeft een wachtwoord dat ontbreekt)."; exit 1; }
          # Vingerafdruk van de server ophalen; bij elke volgende verbinding wordt die gecontroleerd.
          ssh-keyscan -p "$SSH_PORT" -T 30 "$SSH_HOST" > ~/.ssh/known_hosts 2> /dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Geen SSH-verbinding met $SSH_HOST op poort $SSH_PORT. Staat SSH-toegang aan bij GoDaddy?"
            exit 1
          fi

      - name: Uploaden naar public_html (SSH)
        if: steps.ssh.outputs.klaar == 'ja'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: SSH_KEY_FILE="$HOME/.ssh/upload_key" bash scripts/upload-ssh.sh

      - name: Sleutel opruimen
        if: always()
        run: rm -f ~/.ssh/upload_key
